# One command for both processes: docker compose up --build
# The UI is published on port 43132. /graphql is proxied to the Go API.
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "43131:43131"
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "43132:80"
    depends_on:
      - backend
