# Vet and test the web server, the frontend, and the container image.
# cmd/gonetlogo and internal/gui are the Fyne desktop app. They need cgo
# and X11 and are not built here.

name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    # setup-go writes the module cache. A workflow token limited to
    # contents: read cannot save that cache.
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Vet and test
        run: |
          set -euo pipefail
          # Name the non-GUI roots. go list ./... also loads the desktop
          # packages, and that fails when cgo is off.
          pkgs=$(go list \
            ./backend/... \
            ./pkg/... \
            ./models \
            ./internal/locale \
            ./internal/logcfg \
            ./cmd/modelcheck)
          echo "$pkgs"
          go vet $pkgs
          go test $pkgs

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    # setup-node writes the npm cache. A workflow token limited to
    # contents: read cannot save that cache.
    permissions:
      contents: read
      actions: write
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  docker:
    name: Docker
    runs-on: ubuntu-latest
    # cache-to type=gha writes the Actions cache. A workflow token limited
    # to contents: read cannot reserve that cache, and the build then fails.
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          platforms: linux/amd64,linux/arm64
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
