# Destroy the app stack and leave the persistent pieces in place:
# state bucket, OIDC provider, deploy role, hosted zone, certificate,
# ECR repository, budget, and the image tag. Type destroy in the confirm
# box. The production environment is the approval gate.

name: Infra down

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type destroy to tear down the app stack."
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: gonetlogo-production
  cancel-in-progress: false

jobs:
  destroy:
    name: Destroy app stack
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      TF_IN_AUTOMATION: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          if [ "$CONFIRM" != "destroy" ]; then
            echo "Refusing to destroy. Re-run Infra down and type destroy in the confirm box." >&2
            exit 1
          fi

      - name: Check deploy role variable
        env:
          ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: |
          set -euo pipefail
          if [ -z "$ROLE_ARN" ]; then
            echo "Set the repository variable AWS_DEPLOY_ROLE_ARN to the deploy_role_arn output from infra/bootstrap." >&2
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-west-2
          role-session-name: gonetlogo-down

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version_file: infra/.opentofu-version
          tofu_wrapper: false

      - name: Destroy
        working-directory: infra/app
        run: |
          set -euo pipefail
          tofu init -input=false
          tofu destroy -input=false -auto-approve -lock-timeout=10m
