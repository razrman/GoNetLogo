# GoNetLogo authentication. provider: none leaves the site anonymous,
# which is how existing deploys behave. Set provider: local to turn on
# email-and-password accounts stored in users_file.
#
# The local file is ephemeral. A container restart, or deleting the file,
# drops every account and password. It is not a production user database.
#
# Pass 2 will add real providers. The commented blocks below are the
# settings those plugins will read. Selecting cognito or github today
# fails at startup because those plugins are not registered.

provider: none
require_login: false

# How long a signed-in browser stays signed in. A Go duration.
session_lifetime: 168h

cookie:
  name: gonetlogo_auth
  # Set true when the site is served on HTTPS. Local http must stay false.
  secure: false
  # lax, strict, or none. none requires secure: true.
  same_site: lax
  path: /

# Created on first signup. Relative paths are from the process working
# directory. In the container that directory is /tmp, so this file
# disappears when the container is replaced.
users_file: data/users.json

# Open model sessions each account may have. An admin can change it
# per user. Existing accounts with no value use this number. 1 to 50.
default_max_sessions: 4

# Addresses that are admins. A person who signs up with one of these
# emails becomes an admin. On each startup, an existing user with one
# of these emails is promoted. The address is not given a password here;
# they still sign up or log in.
initial_admin_emails: []

providers:
  local:
    min_password_length: 8

